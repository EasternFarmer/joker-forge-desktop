name: Nightly Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: nightly-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Nightly Metadata
    runs-on: ubuntu-latest
    outputs:
      nightly_version: ${{ steps.meta.outputs.nightly_version }}
      nightly_tag: ${{ steps.meta.outputs.nightly_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute nightly version and release notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION=$(node -p "require('./app-version.json').version")
          DATE_STAMP=$(date +"%Y%m%d")
          DATE_READABLE=$(date +"%Y-%m-%d")
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.${DATE_STAMP}.${GITHUB_RUN_NUMBER}"
          NIGHTLY_TAG="nightly-${NIGHTLY_VERSION}"
          RELEASE_NAME="Nightly ${NIGHTLY_VERSION}"

          LAST_NIGHTLY_TAG=$(git tag --list 'nightly-*' --sort=-creatordate | head -n 1 || true)

          {
            echo "## Nightly Build"
            echo
            echo "- Version: ${NIGHTLY_VERSION}"
            echo "- Date: ${DATE_READABLE}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Trigger: push"
            echo
            echo "## Commits Since Previous Nightly"
            echo
            if [ -n "${LAST_NIGHTLY_TAG}" ]; then
              echo "Previous nightly tag: ${LAST_NIGHTLY_TAG}"
              echo
              git log "${LAST_NIGHTLY_TAG}..HEAD" --pretty=format:'- %s (%h) by %an'
            else
              echo "No previous nightly tag found. Showing recent commits:"
              echo
              git log -n 30 --pretty=format:'- %s (%h) by %an'
            fi
          } > release-notes.md

          {
            echo "nightly_version=${NIGHTLY_VERSION}"
            echo "nightly_tag=${NIGHTLY_TAG}"
            echo "release_name=${RELEASE_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-release-notes
          path: release-notes.md

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundle_args: --bundles nsis
            artifact_glob: src-tauri/target/release/bundle/nsis/*.exe
          - platform: linux
            os: ubuntu-22.04
            bundle_args: --bundles appimage,deb
            artifact_glob: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - platform: macos
            os: macos-latest
            bundle_args: --bundles dmg
            artifact_glob: src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libgtk-3-dev \
            dpkg-dev \
            dbus-x11 \
            xvfb \
            xauth \
            xdotool

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare nightly app identity and version
        run: npm run prepare:nightly
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.nightly_version }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri bundle
        run: npx tauri build ${{ matrix.bundle_args }}

      - name: Check Linux AppImage libraries
        if: matrix.platform == 'linux'
        run: |
          chmod +x src-tauri/target/release/bundle/appimage/*.AppImage
          python3 scripts/check-linux-appimage.py src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Smoke test Linux AppImage startup
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/joker-forge-smoke/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/joker-forge-smoke/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/joker-forge-smoke/cache"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          for appimage in src-tauri/target/release/bundle/appimage/*.AppImage; do
            dbus-run-session -- xvfb-run -a bash -c '
              status=0
              timeout --kill-after=5s 15s "$1" > appimage-startup.log 2>&1 &
              app_pid=$!
              window_seen=false
              window_lost=false
              startup_error=false
              deadline=$((SECONDS + 13))
              while [ "$SECONDS" -lt "$deadline" ]; do
                if xdotool search --onlyvisible --name "^Joker Forge" >/dev/null 2>&1; then
                  window_seen=true
                elif [ "$window_seen" = true ]; then
                  window_lost=true
                  break
                fi
                kill -0 "$app_pid" 2>/dev/null || break
                sleep 0.5
              done
              # Read fatal errors before the deliberate timeout shuts WebKit down.
              if grep -Ei "EGL_BAD_PARAMETER|Could not create default EGL display|panicked at|error while building tauri application|WebKit.*(crash|terminated)|Aborting" appimage-startup.log; then
                startup_error=true
              fi
              wait "$app_pid" || status=$?
              cat appimage-startup.log
              if [ "$status" -ne 124 ] || [ "$window_seen" != true ] || [ "$window_lost" = true ]; then
                echo "::error::AppImage did not open a window and remain running for 15 seconds (exit $status)."
                exit 1
              fi
              if [ "$startup_error" = true ]; then
                echo "::error::AppImage reported a fatal startup error."
                exit 1
              fi
            ' bash "$PWD/$appimage"
          done

      - name: Upload Linux startup log
        if: always() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-linux-startup-log
          path: appimage-startup.log
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bundles-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}

  publish:
    name: Publish Nightly Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: nightly-release-notes
          path: .

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-bundles-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.nightly_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          body_path: release-notes.md
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: release-assets/**

  cleanup:
    name: Cleanup Old Nightlies
    runs-on: ubuntu-latest
    needs:
      - publish

    steps:
      - name: Delete nightly releases beyond retention limit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t OLD_TAGS < <(
            gh release list --limit 200 --json tagName,isPrerelease,publishedAt --jq '
              map(select(.isPrerelease == true and (.tagName | startswith("nightly-"))))
              | sort_by(.publishedAt)
              | reverse
              | .[14:]
              | .[].tagName
            '
          )

          if [ "${#OLD_TAGS[@]}" -eq 0 ]; then
            echo "No old nightly releases to delete."
            exit 0
          fi

          for tag in "${OLD_TAGS[@]}"; do
            echo "Deleting old nightly release and tag: ${tag}"
            gh release delete "${tag}" --yes --cleanup-tag
          done
